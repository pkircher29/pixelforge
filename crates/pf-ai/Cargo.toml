[package]
name = "pf-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AI image provider abstraction for Pixelforge (OpenAI / xAI / Gemini)"

[dependencies]
async-trait.workspace = true
base64.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `net` + `io-util`: the one-shot loopback listener for "Sign in with ChatGPT" (oauth/).
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
uuid.workspace = true
# PKCE S256 code challenge (RFC 7636). Already in the lockfile via rustls/reqwest.
sha2 = "0.10"

# OS keychain. Windows Credential Manager / macOS Keychain are native; Linux uses the
# pure-Rust zbus Secret Service client so CI needs no libdbus headers. keyring 3's docs
# warn that secret-service calls must not run on a tokio worker thread, so
# `keystore::KeyringStore` runs every call on its own std thread.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["full"] }

[[example]]
name = "live"
